<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Көшәк</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #f5f8f3;
            color: #203b34;
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .card {
            background: #fff;
            border: 1px solid #dce9dc;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(32, 59, 52, 0.06);
            width: 100%;
            max-width: 460px;
            padding: 36px 32px 28px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            justify-content: center;
        }
        .brand-mark {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: #def5d2;
            display: grid;
            place-items: center;
            font-size: 24px;
        }
        .brand-name {
            font-size: 22px;
            font-weight: 900;
            color: #17253e;
            line-height: 1.05;
        }
        .brand-sub {
            font-size: 11px;
            color: #687a9a;
            margin-top: 3px;
        }
        h1 {
            font-size: 26px;
            margin: 0 0 6px;
            text-align: center;
            font-weight: 900;
        }
        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .field { margin-bottom: 18px; }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #203b34;
        }
        .muted {
            color: #9ca3af;
            font-size: 12px;
            font-weight: 400;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.15s, box-shadow 0.15s;
            background: #fafcfa;
        }
        input:focus {
            outline: none;
            border-color: #25c95d;
            box-shadow: 0 0 0 3px rgba(37, 201, 93, 0.15);
            background: #fff;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #25c95d;
            color: #fff;
            border: 0;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.15s;
            font-family: inherit;
        }
        button:hover { background: #1fae4f; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
            display: none;
        }
        .error.show { display: block; }
        .footer {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
            font-size: 14px;
        }
        .footer a {
            color: #238562;
            text-decoration: none;
            font-weight: 700;
        }
        .footer a:hover { text-decoration: underline; }
        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin: 24px 0 14px;
            padding-top: 18px;
            border-top: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand">
            <div class="brand-mark">🌿</div>
            <div>
                <div class="brand-name">Көшәк</div>
                <div class="brand-sub">школа возможностей</div>
            </div>
        </div>

        <h1>Создать аккаунт</h1>
        <p class="subtitle">Присоединяйтесь и начните учиться</p>

        <div id="error-box" class="error"></div>

        <form id="register-form" novalidate>
            <div class="field">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" required
                       autocomplete="username" minlength="3" maxlength="32"
                       placeholder="Например, aigul_92">
            </div>

            <div class="field">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required
                       autocomplete="new-password" minlength="8"
                       placeholder="Минимум 8 символов">
            </div>

            <div class="field">
                <label for="confirm_password">Подтвердите пароль</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                       autocomplete="new-password" minlength="8">
            </div>

            <div class="section-title">Информация об ученике <span class="muted">(необязательно)</span></div>

            <div class="field">
                <label for="city">Город</label>
                <input type="text" id="city" name="city" autocomplete="address-level2"
                       maxlength="100" placeholder="Например, Уфа">
            </div>

            <div class="field">
                <label for="school">Школа</label>
                <input type="text" id="school" name="school" autocomplete="organization"
                       maxlength="100" placeholder="Например, МБОУ СОШ № 5">
            </div>

            <div class="field">
                <label for="grade">Класс</label>
                <input type="text" id="grade" name="grade" maxlength="20"
                       placeholder="Например, 7А">
            </div>

            <button type="submit" id="submit-btn">Зарегистрироваться</button>
        </form>

        <p class="footer">Уже есть аккаунт? <a href="/login">Войти</a></p>
    </div>

    <script>
        const form = document.getElementById('register-form');
        const errorBox = document.getElementById('error-box');
        const submitBtn = document.getElementById('submit-btn');

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.add('show');
        }
        function hideError() {
            errorBox.classList.remove('show');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            const city = document.getElementById('city').value.trim();
            const school = document.getElementById('school').value.trim();
            const grade = document.getElementById('grade').value.trim();

            if (username.length < 3) {
                showError('Логин должен быть не короче 3 символов');
                return;
            }
            if (password.length < 8) {
                showError('Пароль должен быть не короче 8 символов');
                return;
            }
            if (password !== confirmPassword) {
                showError('Пароли не совпадают');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Отправка...';

            try {
                const params = new URLSearchParams({
                    username: username,
                    password: password,
                    confirm_password: confirmPassword,
                });
                if (city) params.append('city', city);
                if (school) params.append('school', school);
                if (grade) params.append('grade', grade);

                const res = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params,
                    redirect: 'manual',
                });

                if (res.type === 'opaqueredirect' || res.status === 303 || res.status === 0) {
                    window.location.href = '/';
                    return;
                }

                if (res.status === 409) {
                    showError('Пользователь с таким логином уже существует');
                } else if (res.status === 400) {
                    showError('Проверьте правильность заполнения полей');
                } else {
                    showError('Ошибка регистрации (код ' + res.status + ')');
                }
            } catch (err) {
                showError('Не удалось связаться с сервером. Проверьте соединение.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Зарегистрироваться';
            }
        });
    </script>

</body>
</html>
