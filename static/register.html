<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 460px;
            margin: 40px auto;
            padding: 0 16px;
            color: #111827;
        }
        h1 { text-align: center; margin-bottom: 24px; }
        .field { margin-bottom: 16px; }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        .muted {
            color: #6b7280;
            font-size: 13px;
            font-weight: normal;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
        }
        input:focus {
            outline: 2px solid #3b82f6;
            border-color: transparent;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: 0;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover { background: #2563eb; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            font-size: 14px;
        }
        .footer a { color: #3b82f6; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 24px 0 12px;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>

    <h1>Регистрация</h1>

    <div id="error-box" class="error" style="display: none;"></div>

    <form id="register-form" novalidate>
        <div class="field">
            <label for="username">Логин</label>
            <input type="text" id="username" name="username" required
                   autocomplete="username" minlength="3" maxlength="32">
        </div>

        <div class="field">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" required
                   autocomplete="new-password" minlength="8">
        </div>

        <div class="field">
            <label for="confirm_password">Подтвердите пароль</label>
            <input type="password" id="confirm_password" name="confirm_password" required
                   autocomplete="new-password" minlength="8">
        </div>

        <div class="section-title">Информация об ученике (необязательно)</div>

        <div class="field">
            <label for="city">Город <span class="muted">(необязательно)</span></label>
            <input type="text" id="city" name="city" autocomplete="address-level2"
                   maxlength="100" placeholder="Например, Уфа">
        </div>

        <div class="field">
            <label for="school">Школа <span class="muted">(необязательно)</span></label>
            <input type="text" id="school" name="school" autocomplete="organization"
                   maxlength="100" placeholder="Например, МБОУ СОШ № 5">
        </div>

        <div class="field">
            <label for="grade">Класс <span class="muted">(необязательно)</span></label>
            <input type="text" id="grade" name="grade" maxlength="20"
                   placeholder="Например, 7А">
        </div>

        <button type="submit" id="submit-btn">Зарегистрироваться</button>
    </form>

    <p class="footer">Уже есть аккаунт? <a href="/login">Войти</a></p>

    <script>
        const form = document.getElementById('register-form');
        const errorBox = document.getElementById('error-box');
        const submitBtn = document.getElementById('submit-btn');

        function showError(message) {
            errorBox.textContent = message;
            errorBox.style.display = 'block';
        }

        function hideError() {
            errorBox.style.display = 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            const city = document.getElementById('city').value.trim();
            const school = document.getElementById('school').value.trim();
            const grade = document.getElementById('grade').value.trim();

            if (username.length < 3) {
                showError('Логин должен быть не короче 3 символов');
                return;
            }
            if (password.length < 8) {
                showError('Пароль должен быть не короче 8 символов');
                return;
            }
            if (password !== confirmPassword) {
                showError('Пароли не совпадают');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Отправка...';

            try {
                const params = new URLSearchParams({
                    username: username,
                    password: password,
                    confirm_password: confirmPassword,
                });
                if (city) params.append('city', city);
                if (school) params.append('school', school);
                if (grade) params.append('grade', grade);

                const res = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params,
                    redirect: 'manual',
                });

                if (res.type === 'opaqueredirect' || res.status === 303 || res.status === 0) {
                    window.location.href = '/';
                    return;
                }

                if (res.status === 409) {
                    showError('Пользователь с таким логином уже существует');
                } else if (res.status === 400) {
                    showError('Проверьте правильность заполнения полей');
                } else {
                    showError('Ошибка регистрации (код ' + res.status + ')');
                }
            } catch (err) {
                showError('Не удалось связаться с сервером. Проверьте соединение.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Зарегистрироваться';
            }
        });
    </script>

</body>
</html>
