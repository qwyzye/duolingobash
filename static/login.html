<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Көшәк</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #f5f8f3;
            color: #203b34;
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .card {
            background: #fff;
            border: 1px solid #dce9dc;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(32, 59, 52, 0.06);
            width: 100%;
            max-width: 420px;
            padding: 36px 32px 28px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            justify-content: center;
        }
        .brand-mark {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: #def5d2;
            display: grid;
            place-items: center;
            font-size: 24px;
        }
        .brand-name {
            font-size: 22px;
            font-weight: 900;
            color: #17253e;
            line-height: 1.05;
        }
        .brand-sub {
            font-size: 11px;
            color: #687a9a;
            margin-top: 3px;
        }
        h1 {
            font-size: 26px;
            margin: 0 0 6px;
            text-align: center;
            font-weight: 900;
        }
        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .field { margin-bottom: 18px; }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #203b34;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.15s, box-shadow 0.15s;
            background: #fafcfa;
        }
        input:focus {
            outline: none;
            border-color: #25c95d;
            box-shadow: 0 0 0 3px rgba(37, 201, 93, 0.15);
            background: #fff;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #25c95d;
            color: #fff;
            border: 0;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.15s;
            font-family: inherit;
        }
        button:hover { background: #1fae4f; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
            display: none;
        }
        .error.show { display: block; }
        .footer {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
            font-size: 14px;
        }
        .footer a {
            color: #238562;
            text-decoration: none;
            font-weight: 700;
        }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand">
            <div class="brand-mark">🌿</div>
            <div>
                <div class="brand-name">Көшәк</div>
                <div class="brand-sub">школа возможностей</div>
            </div>
        </div>

        <h1>С возвращением!</h1>
        <p class="subtitle">Войдите, чтобы продолжить учиться</p>

        <div id="error-box" class="error"></div>

        <form id="login-form" novalidate>
            <div class="field">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" required
                       autocomplete="username" autofocus>
            </div>
            <div class="field">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required
                       autocomplete="current-password">
            </div>
            <button type="submit" id="submit-btn">Войти</button>
        </form>

        <p class="footer">Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const errorBox = document.getElementById('error-box');
        const submitBtn = document.getElementById('submit-btn');

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.add('show');
        }
        function hideError() {
            errorBox.classList.remove('show');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('Заполните логин и пароль');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Вход...';

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ username, password }),
                    redirect: 'manual',
                });

                if (res.type === 'opaqueredirect' || res.status === 303 || res.status === 0) {
                    window.location.href = '/';
                    return;
                }
                if (res.status === 401) {
                    showError('Неверный логин или пароль');
                } else {
                    showError('Ошибка входа (код ' + res.status + ')');
                }
            } catch (err) {
                showError('Не удалось связаться с сервером');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Войти';
            }
        });
    </script>

</body>
</html>
